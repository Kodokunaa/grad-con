<VirtualHost *:__PORT__>
    ServerName _default_
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    KeepAlive On
    MaxKeepAliveRequests 100
    KeepAliveTimeout 2

    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml
    Header append Vary Accept-Encoding

    <FilesMatch "\.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>

    <Directory /var/www/html/public/build>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
